<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – LucHTSportBooking</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <style>
    body { background: #0F1419; color: #fff; font-family: -apple-system, sans-serif; margin: 0; }
    .topbar {
      background: rgba(15,20,25,.96);
      border-bottom: 1px solid #2C3E50;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .topbar-nav { display: flex; gap: 10px; align-items: center; }
    .topbar-nav a { color: #B0BEC5; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 6px; transition: background .2s; }
    .topbar-nav a:hover, .topbar-nav a.active { background: #1A1F2E; color: #00BCD4; }
    .btn-logout { background: #EF5350; color: #fff; border: none; padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-logout:hover { background: #B71C1C; }

    .dashboard { max-width: 1280px; margin: 0 auto; padding: 28px 20px; }
    .page-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .page-subtitle { color: #B0BEC5; font-size: 14px; margin-bottom: 28px; }

    /* Overview cards */
    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: #1A1F2E; border-radius: 12px; padding: 22px 20px;
      border: 1px solid #2C3E50; transition: transform .15s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card .sc-icon { font-size: 28px; margin-bottom: 10px; }
    .stat-card .sc-value { font-size: 28px; font-weight: 700; color: #00BCD4; }
    .stat-card .sc-label { font-size: 13px; color: #B0BEC5; margin-top: 4px; }
    .stat-card.green .sc-value { color: #4CAF50; }
    .stat-card.orange .sc-value { color: #FFA726; }
    .stat-card.red .sc-value { color: #EF5350; }
    .stat-card.blue .sc-value { color: #42A5F5; }
    .stat-card.yellow .sc-value { color: #FFD600; }

    /* Charts grid */
    .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 28px; }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card {
      background: #1A1F2E; border-radius: 12px; padding: 22px 20px;
      border: 1px solid #2C3E50;
    }
    .chart-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #E0E0E0; }

    /* Period switcher */
    .period-switch { display: flex; gap: 6px; margin-bottom: 14px; }
    .period-switch button {
      padding: 5px 14px; border-radius: 20px; border: 1px solid #2C3E50;
      background: transparent; color: #B0BEC5; cursor: pointer; font-size: 12px;
    }
    .period-switch button.active { background: #00BCD4; color: #0F1419; border-color: #00BCD4; font-weight: 700; }

    /* Table */
    .section-card { background: #1A1F2E; border-radius: 12px; padding: 22px 20px; border: 1px solid #2C3E50; margin-bottom: 20px; }
    .section-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #E0E0E0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 8px 12px; color: #B0BEC5; border-bottom: 1px solid #2C3E50; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid #1e2736; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #20283a; }
    .rank-badge { background: #00BCD4; color: #000; padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 11px; }
    .rank-badge.rank-1 { background: #FFD600; }
    .rank-badge.rank-2 { background: #B0BEC5; }
    .rank-badge.rank-3 { background: #FFA726; }

    /* Status badges */
    .badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-pending { background: rgba(255,167,38,.15); color: #FFA726; }
    .badge-confirmed { background: rgba(76,175,80,.15); color: #4CAF50; }
    .badge-cancelled { background: rgba(239,83,80,.15); color: #EF5350; }

    .loading-overlay { display: flex; align-items: center; justify-content: center; min-height: 200px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #2C3E50; border-top-color: #00BCD4; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: #EF5350; text-align: center; padding: 20px; font-size: 14px; }

    /* Recent bookings table */
    .recent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 900px) { .recent-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- Topbar -->
<nav class="topbar">
  <div class="topbar-brand">⚽ LucHTSportBooking</div>
  <div class="topbar-nav">
    <a href="/fields.html">🏟️ Sân bóng</a>
    <a href="/booking.html">📅 Đặt sân</a>
    <a href="/admin.html" class="active">📊 Admin</a>
    <span id="adminName" style="color:#B0BEC5;font-size:13px;margin-left:8px;"></span>
    <button class="btn-logout" onclick="handleLogout()">Đăng xuất</button>
  </div>
</nav>

<div class="dashboard">
  <div class="page-title">📊 Admin Dashboard</div>
  <div class="page-subtitle">Thống kê tổng quan hệ thống đặt sân LucHTSportBooking</div>

  <!-- Overview Stats -->
  <div id="overviewSection">
    <div class="loading-overlay"><div class="spinner"></div></div>
  </div>

  <!-- Revenue Chart + Booking Status Pie -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3>📈 Doanh Thu & Booking</h3>
      <div class="period-switch">
        <button id="btn30" class="active" onclick="switchPeriod('30')">30 ngày</button>
        <button id="btnMonth" onclick="switchPeriod('month')">Theo tháng</button>
      </div>
      <canvas id="revenueChart" height="90"></canvas>
    </div>
    <div class="chart-card">
      <h3>🥧 Trạng Thái Booking</h3>
      <canvas id="statusChart" height="200"></canvas>
      <div id="statusLegend" style="margin-top:12px;font-size:12px;"></div>
    </div>
  </div>

  <!-- Top Fields + Recent Activities -->
  <div class="recent-grid">
    <div class="section-card">
      <h3>🏆 Top Sân Được Đặt Nhiều Nhất</h3>
      <div id="topFieldsTable"><div class="loading-overlay"><div class="spinner"></div></div></div>
    </div>
    <div class="section-card">
      <h3>💰 Top Sân Doanh Thu Cao Nhất</h3>
      <div id="topRevenueTable"><div class="loading-overlay"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- Recent Bookings -->
  <div class="section-card">
    <h3>📋 Booking Gần Đây</h3>
    <div id="recentBookingsTable"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>
</div>

<script>
const API_BASE = '/api';
let revenueChartInstance = null;
let statusChartInstance = null;
let cachedStats = null;

// ── Auth ──────────────────────────────────────────────
function getToken() { return localStorage.getItem('token'); }

function checkAuth() {
  const token = getToken();
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  if (!token || !user || user.role !== 'admin') {
    alert('Bạn không có quyền truy cập trang này');
    window.location.href = '/login.html';
    return false;
  }
  document.getElementById('adminName').textContent = '👤 ' + user.name;
  return true;
}

function handleLogout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '/login.html';
}

async function apiFetch(path) {
  const res = await fetch(API_BASE + path, {
    headers: { Authorization: 'Bearer ' + getToken() }
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  return res.json();
}

// ── Overview Cards ─────────────────────────────────────
async function loadOverview() {
  const el = document.getElementById('overviewSection');
  try {
    cachedStats = await apiFetch('/admin/stats');
    const s = cachedStats;
    el.innerHTML = `
      <div class="overview-grid">
        <div class="stat-card yellow">
          <div class="sc-icon">💰</div>
          <div class="sc-value">${formatMoney(s.totalRevenue)}</div>
          <div class="sc-label">Tổng doanh thu (đã TT)</div>
        </div>
        <div class="stat-card">
          <div class="sc-icon">📋</div>
          <div class="sc-value">${s.totalBookings}</div>
          <div class="sc-label">Tổng lượt đặt sân</div>
        </div>
        <div class="stat-card green">
          <div class="sc-icon">✅</div>
          <div class="sc-value">${s.confirmedBookings}</div>
          <div class="sc-label">Đã xác nhận</div>
        </div>
        <div class="stat-card orange">
          <div class="sc-icon">⏳</div>
          <div class="sc-value">${s.pendingBookings}</div>
          <div class="sc-label">Chờ xác nhận</div>
        </div>
        <div class="stat-card red">
          <div class="sc-icon">❌</div>
          <div class="sc-value">${s.cancelledBookings}</div>
          <div class="sc-label">Đã hủy</div>
        </div>
        <div class="stat-card blue">
          <div class="sc-icon">🏟️</div>
          <div class="sc-value">${s.totalFields}</div>
          <div class="sc-label">Sân bóng</div>
        </div>
        <div class="stat-card blue">
          <div class="sc-icon">👥</div>
          <div class="sc-value">${s.totalUsers}</div>
          <div class="sc-label">Người dùng</div>
        </div>
        <div class="stat-card">
          <div class="sc-icon">⭐</div>
          <div class="sc-value">${s.totalReviews}</div>
          <div class="sc-label">Đánh giá</div>
        </div>
      </div>`;
    drawStatusChart(s);
  } catch (e) {
    el.innerHTML = `<div class="error-msg">❌ Không tải được thống kê: ${e.message}</div>`;
  }
}

// ── Revenue Chart ──────────────────────────────────────
async function loadRevenueByDay() {
  try {
    const data = await apiFetch('/admin/revenue-by-day?days=30');
    drawRevenueChart(
      data.map(d => d.date.substring(5)), // MM-DD
      data.map(d => d.revenue),
      data.map(d => d.bookings)
    );
  } catch (e) { console.error(e); }
}

async function loadRevenueByMonth() {
  try {
    const data = await apiFetch('/admin/revenue-by-month');
    drawRevenueChart(
      data.map(d => d.month),
      data.map(d => d.revenue),
      data.map(d => d.bookings)
    );
  } catch (e) { console.error(e); }
}

function switchPeriod(period) {
  document.getElementById('btn30').classList.toggle('active', period === '30');
  document.getElementById('btnMonth').classList.toggle('active', period === 'month');
  if (period === '30') loadRevenueByDay();
  else loadRevenueByMonth();
}

function drawRevenueChart(labels, revenues, bookings) {
  const ctx = document.getElementById('revenueChart').getContext('2d');
  if (revenueChartInstance) revenueChartInstance.destroy();
  revenueChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Doanh thu (đ)',
          data: revenues,
          backgroundColor: 'rgba(0,188,212,0.7)',
          borderColor: '#00BCD4',
          borderWidth: 1,
          yAxisID: 'y',
        },
        {
          label: 'Số booking',
          data: bookings,
          type: 'line',
          borderColor: '#FFA726',
          backgroundColor: 'rgba(255,167,38,.15)',
          tension: 0.3,
          pointRadius: 3,
          yAxisID: 'y1',
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#B0BEC5', font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: '#B0BEC5', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#2C3E50' } },
        y: {
          position: 'left',
          ticks: { color: '#B0BEC5', font: { size: 10 }, callback: v => formatMoney(v) },
          grid: { color: '#2C3E50' }
        },
        y1: {
          position: 'right',
          ticks: { color: '#FFA726', font: { size: 10 } },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

function drawStatusChart(s) {
  const ctx = document.getElementById('statusChart').getContext('2d');
  if (statusChartInstance) statusChartInstance.destroy();
  const labels = ['Đã xác nhận', 'Chờ xác nhận', 'Đã hủy'];
  const data = [s.confirmedBookings, s.pendingBookings, s.cancelledBookings];
  const colors = ['#4CAF50', '#FFA726', '#EF5350'];
  statusChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw}` } }
      }
    }
  });
  // Custom legend
  document.getElementById('statusLegend').innerHTML = labels.map((l, i) =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;color:#E0E0E0">
      <span style="width:10px;height:10px;border-radius:50%;background:${colors[i]};display:inline-block;"></span>${l}: <b>${data[i]}</b>
    </span>`
  ).join('');
}

// ── Top Fields ────────────────────────────────────────
async function loadTopFields() {
  try {
    const data = await apiFetch('/admin/top-fields?limit=5');
    const sorted = [...data].sort((a, b) => b.bookingCount - a.bookingCount);
    renderTopTable('topFieldsTable', sorted, 'bookingCount', 'lượt');

    const sortedRev = [...data].sort((a, b) => b.revenue - a.revenue);
    renderTopTable('topRevenueTable', sortedRev, 'revenue', '', true);
  } catch (e) {
    document.getElementById('topFieldsTable').innerHTML = `<div class="error-msg">Lỗi tải dữ liệu</div>`;
    document.getElementById('topRevenueTable').innerHTML = `<div class="error-msg">Lỗi tải dữ liệu</div>`;
  }
}

function renderTopTable(elId, data, valueKey, unit, isMoney = false) {
  if (!data.length) { document.getElementById(elId).innerHTML = '<p style="color:#B0BEC5;font-size:13px">Chưa có dữ liệu</p>'; return; }
  const rankClass = (i) => ['rank-1','rank-2','rank-3'][i] || '';
  document.getElementById(elId).innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Tên sân</th><th>Loại</th><th>${isMoney ? 'Doanh thu' : 'Lượt đặt'}</th></tr></thead>
      <tbody>
        ${data.map((f, i) => `
          <tr>
            <td><span class="rank-badge ${rankClass(i)}">${i+1}</span></td>
            <td>${f.name || '—'}</td>
            <td style="color:#B0BEC5">${f.type || '—'}</td>
            <td style="color:#00BCD4;font-weight:700">${isMoney ? formatMoney(f.revenue) : f.bookingCount + ' ' + unit}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

// ── Recent Bookings ────────────────────────────────────
async function loadRecentBookings() {
  try {
    const data = await apiFetch('/bookings');
    const recent = data.slice(0, 10);
    if (!recent.length) {
      document.getElementById('recentBookingsTable').innerHTML = '<p style="color:#B0BEC5;font-size:13px">Chưa có booking nào</p>';
      return;
    }
    document.getElementById('recentBookingsTable').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>Sân</th>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Thanh toán</th>
          </tr>
        </thead>
        <tbody>
          ${recent.map(b => `
            <tr>
              <td style="color:#B0BEC5;font-size:11px">${b.orderCode || b._id.substring(0,8)+'...'}</td>
              <td>${b.user?.name || b.userName || '—'}</td>
              <td>${b.field?.name || b.fieldName || '—'}</td>
              <td>${formatDate(b.date)}</td>
              <td style="white-space:nowrap">${b.startHour}:00 - ${b.endHour}:00</td>
              <td style="color:#00BCD4;font-weight:700">${formatMoney(b.totalPrice)}</td>
              <td>${statusBadge(b.status)}</td>
              <td>${payBadge(b.paymentStatus)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    document.getElementById('recentBookingsTable').innerHTML = `<div class="error-msg">Lỗi tải booking: ${e.message}</div>`;
  }
}

// ── Helpers ───────────────────────────────────────────
function formatMoney(v) {
  if (v >= 1_000_000) return (v / 1_000_000).toFixed(1) + 'M đ';
  if (v >= 1_000) return (v / 1_000).toFixed(0) + 'K đ';
  return (v || 0).toLocaleString('vi-VN') + ' đ';
}
function formatDate(d) {
  if (!d) return '—';
  const p = d.substring(0, 10).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
}
function statusBadge(s) {
  const map = { confirmed: ['badge-confirmed','Đã xác nhận'], pending: ['badge-pending','Chờ xác nhận'], cancelled: ['badge-cancelled','Đã hủy'] };
  const [cls, txt] = map[s] || ['', s];
  return `<span class="badge ${cls}">${txt}</span>`;
}
function payBadge(s) {
  if (s === 'paid') return `<span class="badge badge-confirmed">✅ Đã TT</span>`;
  if (s === 'failed') return `<span class="badge badge-cancelled">❌ Thất bại</span>`;
  return `<span class="badge badge-pending">⏳ Chưa TT</span>`;
}

// ── Init ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (!checkAuth()) return;
  loadOverview();
  loadRevenueByDay();
  loadTopFields();
  loadRecentBookings();
});
</script>
</body>
</html>
